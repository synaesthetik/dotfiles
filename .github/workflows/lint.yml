name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck v0.11.0
        run: |
          scversion="v0.11.0"
          wget -qO- "https://github.com/koalaman/shellcheck/releases/download/${scversion}/shellcheck-${scversion}.linux.x86_64.tar.xz" | tar -xJ
          sudo cp "shellcheck-${scversion}/shellcheck" /usr/local/bin/
          shellcheck --version

      - name: Install shfmt v3.13.1
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run dot lint
        run: ./bin/dot lint
